<div id="tcp-intro">
  <canvas id="tcp-intro-particles"></canvas>
  <div id="tcp-intro-inner">
    <span class="intro-line" id="il-1">Tech Channel Partner</span>
    <div class="intro-line" id="il-2">
      <span class="awards-text">Awards</span>
      <span class="awards-shine"></span>
    </div>
    <span class="intro-line" id="il-3">2026</span>
  </div>
  <button id="tcp-intro-skip">Enter</button>
</div>

<style>
  #tcp-intro {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #1A1714;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    pointer-events: all;
    overflow: hidden;
  }
  #tcp-intro.fade-out {
    opacity: 0;
    transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  #tcp-intro.gone { display: none; }

  /* Particle canvas — fills the overlay */
  #tcp-intro-particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #tcp-intro-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0;
    margin-bottom: 52px;
  }

  .intro-line {
    display: block;
    font-family: 'Mukta Vaani', sans-serif;
    font-weight: 700;
    opacity: 0;
    transform: translateY(22px);
    transition: opacity 0.38s ease, transform 0.38s ease;
    line-height: 1.1;
  }
  .intro-line.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #il-1 {
    font-size: clamp(12px, 2vw, 20px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #a09070;
    font-weight: 400;
    margin-bottom: 8px;
  }

  /* Awards word + shine overlay */
  #il-2 {
    position: relative;
    font-size: clamp(58px, 12vw, 130px);
    letter-spacing: -0.01em;
    line-height: 1;
    overflow: hidden;
  }
  .awards-text {
    background: linear-gradient(90deg, #8a5c1a 0%, #C9A84C 35%, #ffeb9b 65%, #C9A84C 85%, #a07030 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  /* Shine sweep */
  .awards-shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      105deg,
      transparent 0%,
      transparent 30%,
      rgba(255, 245, 180, 0.55) 48%,
      rgba(255, 255, 220, 0.75) 52%,
      transparent 70%,
      transparent 100%
    );
    transform: translateX(-140%);
    pointer-events: none;
  }
  .awards-shine.animate {
    animation: shine-sweep 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes shine-sweep {
    0%   { transform: translateX(-140%); }
    100% { transform: translateX(160%); }
  }

  #il-3 {
    font-size: clamp(14px, 2.6vw, 26px);
    letter-spacing: 0.4em;
    color: #7a6a4a;
    font-weight: 400;
    margin-top: 12px;
  }

  /* Enter button — centred, gold, shimmering */
  #tcp-intro-skip {
    position: relative;
    z-index: 1;
    background: linear-gradient(90deg, #8a5c1a, #C9A84C, #ffeb9b, #C9A84C, #8a5c1a);
    background-size: 300% 100%;
    border: none;
    color: #1A1714;
    font-family: 'Mukta Vaani', sans-serif;
    font-size: clamp(13px, 1.4vw, 16px);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 14px 44px;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    animation: btn-shimmer 2.4s linear infinite;
  }
  #tcp-intro-skip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #tcp-intro-skip:hover {
    filter: brightness(1.12);
  }
  @keyframes btn-shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }
</style>

<script>
(function() {
  if (sessionStorage.getItem('tcp-intro-seen')) {
    var el = document.getElementById('tcp-intro');
    if (el) el.classList.add('gone');
    return;
  }

  /* ── Particle rain ── */
  var canvas  = document.getElementById('tcp-intro-particles');
  var ctx     = canvas.getContext('2d');
  var particles = [];
  var raf;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var COLORS = ['#C9A84C','#E2C97E','#ffeb9b','#a07030','#f5d97a'];

  function Particle() {
    this.reset(true);
  }
  Particle.prototype.reset = function(initial) {
    this.x    = Math.random() * canvas.width;
    this.y    = initial ? Math.random() * canvas.height * 1.2 - canvas.height * 0.2
                        : -12;
    this.size = Math.random() * 3 + 1;
    this.speedY = Math.random() * 1.2 + 0.4;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.7 + 0.2;
    this.color  = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.shape  = Math.random() > 0.55 ? 'circle' : 'rect';
    this.angle  = Math.random() * Math.PI * 2;
    this.spin   = (Math.random() - 0.5) * 0.04;
  };
  Particle.prototype.update = function() {
    this.y     += this.speedY;
    this.x     += this.speedX;
    this.angle += this.spin;
    if (this.y > canvas.height + 16) this.reset(false);
  };
  Particle.prototype.draw = function() {
    ctx.save();
    ctx.globalAlpha = this.opacity;
    ctx.fillStyle   = this.color;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    if (this.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, this.size, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-this.size, -this.size * 1.6, this.size * 2, this.size * 3.2);
    }
    ctx.restore();
  };

  for (var i = 0; i < 120; i++) particles.push(new Particle());

  function drawParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function(p) { p.update(); p.draw(); });
    raf = requestAnimationFrame(drawParticles);
  }
  drawParticles();

  /* ── Dismiss ── */
  function dismiss() {
    sessionStorage.setItem('tcp-intro-seen', '1');
    cancelAnimationFrame(raf);
    var el = document.getElementById('tcp-intro');
    if (!el) return;
    el.classList.add('fade-out');
    el.addEventListener('transitionend', function() {
      el.classList.add('gone');
    }, { once: true });
  }

  document.getElementById('tcp-intro-skip').addEventListener('click', dismiss);

  /* ── Sequence (total ~5s before auto-dismiss) ── */
  // t=150  line1 appears
  // t=550  "Awards" appears
  // t=950  line3 appears
  // t=1200 shine sweeps across Awards
  // t=1600 Enter button appears
  // t=5000 auto dismiss

  setTimeout(function() {
    document.getElementById('il-1').classList.add('visible');
  }, 150);

  setTimeout(function() {
    document.getElementById('il-2').classList.add('visible');
  }, 550);

  setTimeout(function() {
    document.getElementById('il-3').classList.add('visible');
  }, 950);

  setTimeout(function() {
    document.querySelector('.awards-shine').classList.add('animate');
  }, 1250);

  setTimeout(function() {
    document.getElementById('tcp-intro-skip').classList.add('visible');
  }, 1600);

  setTimeout(dismiss, 5000);
})();
</script>
