    </select>

<div id="needDescription"></div>
<div id="resultCount"></div>
<div class="partner-grid" id="partnerGrid"></div>

<script>
function renderPartners(){
    const grid = document.getElementById("partnerGrid");
    const countBox = document.getElementById("resultCount");
    const descriptionBox = document.getElementById("needDescription");
    
    grid.innerHTML = "";

    const selectedNeed = document.getElementById("needFilter").value;
    const selectedCategory = document.getElementById("categoryFilter").value;
    const searchText = document.getElementById("searchInput").value.toLowerCase();

    if(selectedNeed && typeof needDescriptions !== 'undefined' && needDescriptions[selectedNeed]){
        descriptionBox.style.display = "block";
        descriptionBox.textContent = needDescriptions[selectedNeed];
    } else {
        descriptionBox.style.display = "none";
    }

    const sortedPartners = [...partners].sort((a, b) => {
        if(a.premium && !b.premium) return -1;
        if(!a.premium && b.premium) return 1;
        return a.name.localeCompare(b.name);
    });

    const filtered = sortedPartners.filter(p => {
        const matchNeed = !selectedNeed || p.needs.includes(selectedNeed);
        const matchCategory = !selectedCategory || p.category === selectedCategory;
        const matchSearch = p.name.toLowerCase().includes(searchText);
        return matchNeed && matchCategory && matchSearch;
    });
		
    if (filtered.length === 0) {
        countBox.style.display = "none";
        grid.innerHTML = "<p style='grid-column: 1/-1; padding: 3rem; text-align: center; font-size: 1.6rem;'>🔍 Δεν βρέθηκαν αποτελέσματα για τα κριτήρια που επιλέξατε.</p>";
        return;
    }

    // Results Counter Styling
    countBox.style.display = "inline-flex";
    const resultText = filtered.length === 1 
        ? `<span>1</span> Partner βρέθηκε` 
        : `Βρέθηκαν <span>${filtered.length}</span> Partners`;
    countBox.innerHTML = `🤝 ${resultText}`;
		
    filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = p.premium ? "partner-card premium-card" : "partner-card";

        const logoContent = p.logo 
            ? `<img src="${p.logo}" class="partner-logo" alt="${p.name}" onerror="this.parentElement.innerHTML='<div class=\'no-logo\'>${p.name.charAt(0)}</div>'">`
            : `<div class="no-logo">${p.name.charAt(0)}</div>`;

        const buttonHtml = (p.button && p.button.text)
            ? `<a href="${p.button.link}" target="_blank" class="partner-btn" style="background-color: ${p.button.color || '#DD3333'}">${p.button.text}</a>`
            : "";

        card.innerHTML = `
            ${p.premium ? `<div class="partner-badge" title="Premium Partner">⭐</div>` : ""}
            <div class="partner-logo-wrapper">
                ${logoContent}
            </div>
            <div class="partner-name">${p.name}</div>
            <div class="partner-category">${p.category}</div>
            <div class="partner-contact">
                <a href="${p.website}" target="_blank">${p.website.replace(/^https?:\/\//, '')}</a>
                <a href="mailto:${p.email}">${p.email}</a>
            </div>
            ${buttonHtml}
        `;
        grid.appendChild(card);
    });
}

document.getElementById("needFilter").addEventListener("change", renderPartners);
document.getElementById("categoryFilter").addEventListener("change", renderPartners);
document.getElementById("searchInput").addEventListener("input", renderPartners);

window.addEventListener('load', renderPartners);
</script>
