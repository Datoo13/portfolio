<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queen Bbou 👑</title>
<link rel="icon" type="image/jpeg" href="favicon.jpg">
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
    background: linear-gradient(135deg, #ffd6ec 0%, #f3c6ff 40%, #d9b3ff 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    position: relative;
    overflow-x: hidden;
  }

  /* floaty flower decorations */
  .flower {
    position: fixed;
    font-size: 2rem;
    opacity: 0.55;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }
  .flower:nth-child(1){ top: 6%; left: 8%; animation-delay: 0s; }
  .flower:nth-child(2){ top: 15%; right: 10%; animation-delay: 1.5s; font-size: 2.6rem; }
  .flower:nth-child(3){ bottom: 12%; left: 6%; animation-delay: 3s; }
  .flower:nth-child(4){ bottom: 20%; right: 8%; animation-delay: 2s; font-size: 1.6rem; }
  .flower:nth-child(5){ top: 45%; left: 3%; animation-delay: 4s; font-size: 1.4rem; }
  .flower:nth-child(6){ top: 40%; right: 4%; animation-delay: 1s; font-size: 1.8rem; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(6px);
    border-radius: 32px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(180, 80, 200, 0.35);
    border: 3px solid #ffb3e6;
  }

  .profile-pic-wrap {
    width: 160px;
    height: 160px;
    margin: 0 auto 18px;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(135deg, #ff9ad5, #c98bff, #ff9ad5);
    box-shadow: 0 8px 24px rgba(200, 100, 220, 0.4);
  }

  .profile-pic-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid white;
    display: block;
  }

  h1 {
    margin: 6px 0 2px;
    font-size: 2rem;
    color: #b6389c;
    text-shadow: 1px 1px 0 #ffe3f6;
  }

  .handle {
    color: #a855c9;
    font-weight: 600;
    margin-bottom: 18px;
    font-size: 0.95rem;
  }

  .tagline {
    color: #7a3a8c;
    font-size: 1.05rem;
    line-height: 2;
    margin: 20px 0 26px;
    font-weight: 500;
  }

  .tagline div {
    background: rgba(255, 182, 230, 0.35);
    border-radius: 14px;
    padding: 6px 10px;
    margin: 6px 0;
  }

  .qr-wrap {
    background: white;
    display: inline-block;
    padding: 14px;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(180, 80, 200, 0.3);
    border: 2px dashed #ff9ad5;
  }

  .qr-wrap img {
    display: block;
    width: 170px;
    height: 170px;
  }

  .scan-text {
    margin-top: 14px;
    color: #b6389c;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  a.ig-link {
    display: inline-block;
    margin-top: 18px;
    text-decoration: none;
    background: linear-gradient(135deg, #ff8fd0, #b28aff);
    color: white;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(200, 100, 220, 0.4);
    transition: transform 0.2s ease;
  }

  a.ig-link:hover {
    transform: scale(1.05);
  }

  .paw {
    margin-top: 22px;
    font-size: 1.4rem;
    opacity: 0.8;
  }
</style>
</head>
<body>

  <div class="flower">🌸</div>
  <div class="flower">🌷</div>
  <div class="flower">💮</div>
  <div class="flower">🌺</div>
  <div class="flower">🌼</div>
  <div class="flower">💐</div>

  <div class="card">
    <div class="profile-pic-wrap">
      <img src="profile.jpg" alt="Queen Bbou">
    </div>

    <h1>Queen Bbou 👑</h1>
    <div class="handle">@queenbbou</div>

    <div class="tagline">
      <div>Celebrity Dog 😎😎</div>
      <div>Hot stuff 🌭</div>
      <div>Just being queer 💄</div>
      <div>The Queen of dogland 👑</div>
    </div>

    <div class="qr-wrap">
      <img src="qr.jpg" alt="QR code to Instagram">
    </div>
    <div class="scan-text">📸 Scan to follow</div>

    <br>
    <a class="ig-link" href="https://www.instagram.com/queenbbou/" target="_blank" rel="noopener">Follow @queenbbou</a>

    <div class="paw">🐾🐾🐾</div>
  </div>

</body>
</html>
